<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTV Chile TV</title><style>html,body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}#app{display:grid;grid-template-columns:34% 66%;height:100vh}#channels{overflow:auto;padding:18px;background:#111}button{display:block;width:100%;padding:14px;margin:6px 0;background:#222;color:#fff;border:1px solid #444;text-align:left;font-size:18px}button:focus,button.active{outline:3px solid #2aa8ff;background:#333}#view{display:flex;flex-direction:column;background:#000}video{width:100%;height:calc(100% - 52px);background:#000}#status{height:52px;padding:14px;box-sizing:border-box;background:#151515;color:#aaa}.err{color:#ff7676}</style></head><body><div id="app"><aside id="channels"><h2>IPTV Chile</h2><div id="list">Cargando...</div></aside><main id="view"><video id="video" controls autoplay playsinline></video><div id="status">Conectando...</div></main></div><script src="player.js"></script></body></html>
