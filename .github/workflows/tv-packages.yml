name: Build and publish installers

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'platform/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'integration_test/**'
      - 'test/**'
      - '.github/workflows/tv-packages.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'platform/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'integration_test/**'
      - 'test/**'
      - '.github/workflows/tv-packages.yml'
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  quality:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test integration_test tool
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    outputs:
      release_signed: ${{ steps.signing.outputs.configured }}
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, tv, firetv]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check persistent signing configuration
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_STORE_PASSWORD"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent Android signing is not configured. APKs will be built only as temporary CI artifacts and will NOT be published as updateable releases."
          elif [[ "$present" -eq 4 ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Persistent Android signing secrets are present."
          else
            echo "::error::Android signing is partially configured. Set all four secrets or remove all four; refusing an ambiguous build."
            exit 1
          fi
      - run: flutter pub get
      - name: Build Android profile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: dart run tool/build_android_profile.dart --profile=${{ matrix.profile }}
      - name: Validate APK and signing mode
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_DIR="dist/android/${{ matrix.profile }}"
          test -s "$PROFILE_DIR/profile.json"
          test "$(find "$PROFILE_DIR" -type f -name '*.apk' | wc -l)" -eq 1
          APK="$(find "$PROFILE_DIR" -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          if [[ "${{ steps.signing.outputs.configured }}" == "true" ]]; then
            grep -F '"signing": "persistent-release"' "$PROFILE_DIR/profile.json"
          else
            grep -F '"signing": "debug-fallback"' "$PROFILE_DIR/profile.json"
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='${{ github.run_number }}'"
          unzip -l "$APK" | grep -F 'lib/armeabi-v7a/libflutter.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libflutter.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libflutter.so'
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.profile }}
          path: dist/android/${{ matrix.profile }}/*
          if-no-files-found: error
          retention-days: 30

  webos:
    name: LG webOS native Flutter .ipk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip cmake pkg-config file libgtk-3-0 libgtk-3-dev git ninja-build clang git-lfs
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - name: Install webOS Flutter SDK and NDK
        run: |
          set -euo pipefail
          git clone https://github.com/lg-flutter-webos/flutter-webos.git "$RUNNER_TEMP/flutter-webos"
          git -C "$RUNNER_TEMP/flutter-webos" checkout 950398131830e9bd5dc91e588c3db8f5c42322be
          echo "$RUNNER_TEMP/flutter-webos/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/flutter-webos/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/webos-ndk"
          cd "$RUNNER_TEMP/webos-ndk"
          curl -fL --retry 3 -o webos-ndk.sh https://github.com/lg-flutter-webos/ndk/releases/download/11.2.0/webos-ndk-flutter-starfish-x86_64-ca9v1-11.2.0.sh
          chmod +x webos-ndk.sh
          ./webos-ndk.sh -y
      - name: Configure webOS NDK environment
        run: |
          set -euo pipefail
          test -f /usr/local/starfish-sdk-x86_64/environment-setup-ca9v1-webosmllib32-linux-gnueabi
          echo "WEBOS_FLUTTER_NDK_ENV=/usr/local/starfish-sdk-x86_64/environment-setup-ca9v1-webosmllib32-linux-gnueabi" >> "$GITHUB_ENV"
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6
      - name: Verify webOS toolchain
        run: |
          set -euo pipefail
          source "$WEBOS_FLUTTER_NDK_ENV"
          flutter-webos doctor -v
          flutter-webos precache -f
      - name: Create native webOS platform
        run: |
          set -euo pipefail
          sed -i 's/^  video_player: \^2\.14\.1$/  video_player: ^2.11.1/' pubspec.yaml
          source "$WEBOS_FLUTTER_NDK_ENV"
          flutter-webos create --platforms webos .
      - name: Build native webOS IPK
        run: |
          set -euo pipefail
          source "$WEBOS_FLUTTER_NDK_ENV"
          flutter-webos clean
          flutter-webos pub get
          flutter-webos build webos --release
          mkdir -p dist/webos/native
          test "$(find build/webos -type f -name '*.ipk' | wc -l)" -eq 1
          cp "$(find build/webos -type f -name '*.ipk' | head -n1)" dist/webos/native/reproductor-IPTV-LG-webOS-native.ipk
      - name: Validate native webOS package
        run: flutter-webos pub run tool/validate_tv_packages.dart webos --require-native
      - name: Validate IPK archive contents
        run: |
          set -euo pipefail
          IPK=dist/webos/native/reproductor-IPTV-LG-webOS-native.ipk
          test -s "$IPK"
          file "$IPK"
          MEMBERS="$(ar t "$IPK")"
          printf '%s\n' "$MEMBERS" | grep -Fx 'debian-binary'
          printf '%s\n' "$MEMBERS" | grep -E '^control\.tar'
          DATA_MEMBER="$(printf '%s\n' "$MEMBERS" | grep -E '^data\.tar' | head -n1)"
          test -n "$DATA_MEMBER"
          ar p "$IPK" "$DATA_MEMBER" > "$RUNNER_TEMP/webos-data.tar"
          tar -tf "$RUNNER_TEMP/webos-data.tar" | grep -E '(^|/)flutter_assets(/|$)'
          tar -tf "$RUNNER_TEMP/webos-data.tar" | grep -E '(^|/)appinfo\.json$'
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist/webos/native/*.ipk
          if-no-files-found: error
          retention-days: 30

  tizen:
    name: Samsung Tizen .wgt
    if: ${{ vars.TIZEN_CLI_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, tizen]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=web --project-name reproductor_iptv .
      - run: flutter build web --release
      - run: dart run tool/build.dart --target=tizen
      - name: Build and validate .wgt
        env:
          TIZEN_CERT_PROFILE: ${{ secrets.TIZEN_CERT_PROFILE }}
        run: |
          set -euo pipefail
          test -n "$TIZEN_CERT_PROFILE"
          dart run tool/package_tv.dart --target=tizen
          dart run tool/validate_tv_packages.dart tizen --require-native
          test "$(find dist/tizen/native -type f -name '*.wgt' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: dist/tizen/native/*.wgt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish downloadable release
    needs: [quality, android, webos, tizen]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && always() && needs.quality.result == 'success' && needs.android.result == 'success' && needs.android.outputs.release_signed == 'true' && (needs.webos.result == 'success' || needs.webos.result == 'skipped') && (needs.tizen.result == 'success' || needs.tizen.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Collect and name installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          for FILE in release-assets/android-mobile/*.apk; do [ -f "$FILE" ] || continue; cp "$FILE" "release/Reproductor-IPTV-$VERSION-ALPHA-Android-universal.apk"; done
          for FILE in release-assets/android-tv/*.apk; do [ -f "$FILE" ] || continue; cp "$FILE" "release/Reproductor-IPTV-$VERSION-ALPHA-AndroidTV-GoogleTV-universal.apk"; done
          for FILE in release-assets/android-firetv/*.apk; do [ -f "$FILE" ] || continue; cp "$FILE" "release/Reproductor-IPTV-$VERSION-ALPHA-FireTV-FireOS-universal.apk"; done
          for FILE in release-assets/webos-ipk/*.ipk; do [ -f "$FILE" ] || continue; cp "$FILE" "release/Reproductor-IPTV-$VERSION-ALPHA-LG-webOS.ipk"; done
          for FILE in release-assets/tizen-wgt/*.wgt; do [ -f "$FILE" ] || continue; cp "$FILE" "release/Reproductor-IPTV-$VERSION-ALPHA-Samsung-Tizen.wgt"; done
          test "$(find release -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' -o -name '*.wgt' \) | wc -l)" -ge 3
          for profile in mobile tv firetv; do
            test -s "release-assets/android-$profile/profile.json"
            grep -F '"signing": "persistent-release"' "release-assets/android-$profile/profile.json"
          done
          {
            echo "reproductor-IPTV $VERSION ALPHA — DESCARGAS OFICIALES"
            echo
            echo "ANDROID"
            echo "- Reproductor-IPTV-$VERSION-ALPHA-Android-universal.apk"
            echo
            echo "ANDROID TV / GOOGLE TV"
            echo "- Reproductor-IPTV-$VERSION-ALPHA-AndroidTV-GoogleTV-universal.apk"
            echo
            echo "AMAZON FIRE TV / FIRE OS"
            echo "- Reproductor-IPTV-$VERSION-ALPHA-FireTV-FireOS-universal.apk"
            if compgen -G "release/*-LG-webOS.ipk" > /dev/null; then echo; echo "LG SMART TV"; echo "- Reproductor-IPTV-$VERSION-ALPHA-LG-webOS.ipk"; fi
            if compgen -G "release/*-Samsung-Tizen.wgt" > /dev/null; then echo; echo "SAMSUNG SMART TV"; echo "- Reproductor-IPTV-$VERSION-ALPHA-Samsung-Tizen.wgt"; fi
            echo
            echo "IMPORTANTE"
            echo "- Chromecast con Google TV usa la versión Android TV/Google TV."
            echo "- Chromecast tradicional no instala APK."
            echo "- SHA256SUMS.txt acompaña a los instaladores."
          } > release/README.txt
          (cd release; find . -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' -o -name '*.wgt' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          test -s release/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          TAG="v$VERSION-build-${{ github.run_number }}"
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOF
          # reproductor-IPTV $VERSION — ALPHA

          Versión ALPHA en desarrollo. Descargas oficiales por plataforma.

          Los APK Android se publican únicamente si están firmados con la clave persistente del proyecto.
          LG webOS usa el IPK Flutter nativo del SDK de LG.
          La generación del paquete no sustituye la prueba física.
          EOF
          gh release create "$TAG" release/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "reproductor-IPTV $VERSION ALPHA" --notes-file "$NOTES"
          echo "Release $TAG publicado correctamente."
