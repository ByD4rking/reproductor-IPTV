name: Build and publish installers

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'platform/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/tv-packages.yml'
  workflow_dispatch:

concurrency:
  group: installers-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  quality:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Validate Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, tv, firetv]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_android_profile.dart --profile=${{ matrix.profile }}
      - name: Validate APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/android/${{ matrix.profile }}/profile.json
          count=$(find dist/android/${{ matrix.profile }} -type f -name '*.apk' | wc -l)
          test "$count" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.profile }}
          path: dist/android/${{ matrix.profile }}/*.apk
          if-no-files-found: error
          retention-days: 30

  webos:
    name: LG webOS .ipk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: flutter pub get
      - run: flutter create --platforms=web --project-name reproductor_iptv .
      - run: flutter build web --release
      - run: dart run tool/build.dart --target=webos
      - name: Install official webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6
      - name: Build and validate .ipk
        run: |
          set -euo pipefail
          dart run tool/package_tv.dart --target=webos
          dart run tool/validate_tv_packages.dart webos --require-native
          test "$(find dist/webos/native -type f -name '*.ipk' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist/webos/native/*.ipk
          if-no-files-found: error
          retention-days: 30

  tizen:
    name: Samsung Tizen .wgt
    if: ${{ vars.TIZEN_CLI_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, tizen]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=web --project-name reproductor_iptv .
      - run: flutter build web --release
      - run: dart run tool/build.dart --target=tizen
      - name: Build and validate .wgt
        env:
          TIZEN_CERT_PROFILE: ${{ secrets.TIZEN_CERT_PROFILE }}
        run: |
          set -euo pipefail
          test -n "$TIZEN_CERT_PROFILE"
          dart run tool/package_tv.dart --target=tizen
          dart run tool/validate_tv_packages.dart tizen --require-native
          test "$(find dist/tizen/native -type f -name '*.wgt' | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: dist/tizen/native/*.wgt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish downloadable release
    needs: [quality, android, webos, tizen]
    if: ${{ always() && needs.quality.result == 'success' && needs.android.result == 'success' && needs.webos.result == 'success' && (needs.tizen.result == 'success' || needs.tizen.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Collect and name installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          version=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)

          for file in release-assets/android-mobile/*.apk; do
            [ -f "$file" ] || continue
            abi=$(basename "$file" | sed 's/-release\.apk$//')
            cp "$file" "release/Reproductor-IPTV-${version}-Android-${abi}.apk"
          done
          for file in release-assets/android-tv/*.apk; do
            [ -f "$file" ] || continue
            abi=$(basename "$file" | sed 's/-release\.apk$//')
            cp "$file" "release/Reproductor-IPTV-${version}-AndroidTV-GoogleTV-${abi}.apk"
          done
          for file in release-assets/android-firetv/*.apk; do
            [ -f "$file" ] || continue
            abi=$(basename "$file" | sed 's/-release\.apk$//')
            cp "$file" "release/Reproductor-IPTV-${version}-FireTV-FireOS-${abi}.apk"
          done

          for file in release-assets/webos-ipk/*.ipk; do
            [ -f "$file" ] || continue
            cp "$file" "release/Reproductor-IPTV-${version}-LG-webOS.ipk"
          done
          for file in release-assets/tizen-wgt/*.wgt; do
            [ -f "$file" ] || continue
            cp "$file" "release/Reproductor-IPTV-${version}-Samsung-Tizen.wgt"
          done

          cat > release/README.txt <<EOF
          reproductor-IPTV ${version} — DESCARGAS OFICIALES

          ANDROID
          - Android teléfonos/tablets: Reproductor-IPTV-${version}-Android-*.apk

          ANDROID TV / GOOGLE TV / TV BOX
          - Reproductor-IPTV-${version}-AndroidTV-GoogleTV-*.apk

          AMAZON FIRE TV / FIRE OS
          - Reproductor-IPTV-${version}-FireTV-FireOS-*.apk

          LG SMART TV
          - Reproductor-IPTV-${version}-LG-webOS.ipk

          SAMSUNG SMART TV
          - Reproductor-IPTV-${version}-Samsung-Tizen.wgt

          IMPORTANTE
          - Chromecast con Google TV usa la versión Android TV/Google TV.
          - Chromecast tradicional no instala APK.
          - Descarga únicamente el archivo correspondiente a tu dispositivo.
          EOF
          test "$(find release -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' -o -name '*.wgt' \) | wc -l)" -ge 5
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          tag="v${version}-build.${{ github.run_number }}"
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          # reproductor-IPTV ${version}

          Descargas oficiales. Elige según tu dispositivo:

          ## 📱 Android
          APK para teléfonos y tablets Android.

          ## 📺 Android TV / Google TV / TV Box
          APK para dispositivos Android de salón. Chromecast con Google TV usa esta versión.

          ## 🔥 Amazon Fire TV / Fire OS
          APK para Fire TV y dispositivos Fire OS.

          ## 🟦 LG webOS
          IPK para LG Smart TV. Incluye compatibilidad de renderizado webOS y diagnóstico de arranque.

          ## 🟩 Samsung Tizen
          WGT cuando el runner y certificado Tizen estén configurados.

          ## ℹ️ Importante
          Los nombres de los archivos indican claramente la plataforma. No necesitas compilar nada.
          La generación del paquete no sustituye la prueba física en cada modelo de TV.
          EOF
          if ! gh release create "$tag" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "reproductor-IPTV ${version}" \
            --notes-file "$notes_file"; then
            echo 'ERROR: no fue posible publicar el Release.' >&2
            echo 'Configura el secret RELEASE_TOKEN con un token que tenga Contents: write, o habilita esa capacidad para GITHUB_TOKEN.' >&2
            exit 1
          fi
