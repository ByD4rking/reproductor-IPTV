name: TV Packages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'platform/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/tv-packages.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'platform/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/tv-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webos:
    name: Build webOS .ipk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: flutter pub get
      - name: Generate Web platform
        run: flutter create --platforms=web --project-name reproductor_iptv .
      - run: flutter build web --release
      - run: dart run tool/build.dart --target=webos
      - name: Install official webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6
      - name: Package and inspect .ipk
        run: |
          dart run tool/package_tv.dart --target=webos
          dart run tool/validate_tv_packages.dart webos --require-native
      - uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-webos-ipk
          path: dist/webos/native/*.ipk
          if-no-files-found: error
          retention-days: 14

  tizen-payload:
    name: Validate Samsung Tizen payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: dart run tool/build.dart --target=tizen
      - run: dart run tool/validate_tv_packages.dart tizen
      - uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-tizen-payload
          path: dist/tizen/package
          if-no-files-found: error
          retention-days: 14

  tizen-native:
    name: Build Samsung Tizen .wgt
    if: \${{ vars.TIZEN_CLI_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, tizen]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: dart run tool/build.dart --target=tizen
      - name: Package signed .wgt
        env:
          TIZEN_CERT_PROFILE: \${{ secrets.TIZEN_CERT_PROFILE }}
        run: |
          dart run tool/package_tv.dart --target=tizen
          dart run tool/validate_tv_packages.dart tizen --require-native
      - uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-tizen-wgt
          path: dist/tizen/native/*.wgt
          if-no-files-found: error
          retention-days: 14
