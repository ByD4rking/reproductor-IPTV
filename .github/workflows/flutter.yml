name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - name: Validate Dart formatting
        run: dart format --output=none --set-exit-if-changed integration_test

      - run: flutter analyze

      - name: Validate build tools
        run: dart format --output=none --set-exit-if-changed tool/build.dart tool/probe_m3u.dart
      - run: flutter test

      # Generate native hosts needed by CI from the pinned Flutter toolchain.
      # The Dart core remains platform-neutral and can be packaged for each target.
      - name: Generate Android and Web platforms
        run: flutter create --platforms=android,web --project-name reproductor_iptv .

      - name: Configure Android network permission
        run: dart run tool/ensure_android_network_permission.dart
      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Build Web
        run: flutter build web --release

      - name: Verify Web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter.js
          ls -lh build/web/index.html

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-android-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
