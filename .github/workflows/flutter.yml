name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - name: Format Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format .
          if git diff --quiet -- '*.dart'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.dart'
          git commit -m "style: format Dart sources [skip ci]"
          git push
      - run: flutter analyze

      - name: Validate build tools
        run: dart format --output=none --set-exit-if-changed tool/build.dart tool/build_android_profile.dart tool/probe_m3u.dart
      - name: Run flutter test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee flutter-test.log
          exit ${PIPESTATUS[0]}
      - name: Capture test diagnostics
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter-test.log
          git commit -m "ci: capture test diagnostics [skip ci]"
          git push
      - name: Stop on test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1

      # Generate native hosts needed by CI from the pinned Flutter toolchain.
      # The Dart core remains platform-neutral and can be packaged for each target.
      - name: Generate Android and Web platforms
        run: flutter create --platforms=android,web --project-name reproductor_iptv .

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Build Web
        run: flutter build web --release

      - name: Verify Web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter.js
          ls -lh build/web/index.html

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-android-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
