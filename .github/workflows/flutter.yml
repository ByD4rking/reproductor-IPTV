name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - name: Configure and verify Android ExoPlayer forward buffer
        run: dart run tool/configure_android_exoplayer_buffer.dart
      - name: Format Dart sources
        run: dart format lib test integration_test tool

      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Generate native hosts needed by CI from the pinned Flutter toolchain.
      # The Dart core remains platform-neutral and can be packaged for each target.
      - name: Generate Android and Web platforms
        run: flutter create --platforms=android,web --project-name reproductor_iptv .

      - name: Configure Android network permission
        run: dart run tool/ensure_android_network_permission.dart

      - name: Build universal Android APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify universal APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='${{ github.run_number }}'"
          unzip -l "$APK" | grep -F 'lib/armeabi-v7a/libflutter.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libflutter.so'
          unzip -l "$APK" | grep -F 'lib/x86_64/libflutter.so'
          ls -lh "$APK"

      - name: Build Web
        run: flutter build web --release

      - name: Verify Web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter.js
          ls -lh build/web/index.html

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-android-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-iptv-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
