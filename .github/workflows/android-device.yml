name: Android device smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-device.yml'

concurrency:
  group: android-device-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  smoke:
    name: Android emulator (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android --project-name reproductor_iptv .
      - name: Configure Android network permission
        run: dart run tool/ensure_android_network_permission.dart
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Flutter integration smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/smoke_test.dart
